[project]
name = "inbest-whatsapp-tools"
version = "0.1.0"
description = "Read and send WhatsApp Web messages using a linked Chrome profile."
requires-python = ">=3.12"
dependencies = ["playwright>=1.48"]

[project.scripts]
wa = "wa.cli:main"
inbest-wa = "wa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
